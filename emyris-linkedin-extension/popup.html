<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emyris LinkedIn Sync</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 12px;
    }
    .badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
    .sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #94a3b8;
    }
    .value {
      font-weight: 600;
      color: #38bdf8;
    }
    button.btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    button.btn-primary:hover {
      filter: brightness(1.1);
    }
    button.btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.btn-secondary {
      width: 100%;
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button.btn-secondary:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.05);
    }
    #status-msg {
      font-size: 11px;
      text-align: center;
      margin-top: 10px;
      color: #22c55e;
      min-height: 16px;
    }
    .error {
      color: #ef4444 !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">EM</div>
    <div>
      <h2>Emyris Live Sync</h2>
      <div class="sub">Personalized for J. Ranjan Dash</div>
    </div>
  </div>

  <div class="card">
    <div class="stat-row">
      <span class="label">Portal Connection:</span>
      <span class="value" style="color: #22c55e;">● Ready</span>
    </div>
    <div class="stat-row">
      <span class="label">Last Synced:</span>
      <span class="value" id="last-sync-time">Checking...</span>
    </div>
    <div class="stat-row">
      <span class="label">Live Feeds Cached:</span>
      <span class="value" id="total-synced">0</span>
    </div>
  </div>

  <button id="sync-btn" class="btn-primary">
    <span id="sync-text">⚡ Sync Live Feeds Now</span>
  </button>

  <button id="portal-btn" class="btn-secondary">
    Open Executive Desk (emyrishr.in)
  </button>

  <div id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
